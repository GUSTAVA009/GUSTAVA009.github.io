name: V62 inspect original V60 rim
on:
  push:
    branches:
      - vesuvius-v62-rim-texture-repair
    paths:
      - .github/workflows/v62-rim-inspect.yml
      - tools/v62_inspect.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check pillow
      - run: python tools/v62_inspect.py
      - name: Store analysis on experimental branch
        run: |
          git config user.name "GUSTAVA Artifact QA"
          git config user.email "actions@users.noreply.github.com"
          git add zone-artifacts/_v62/v60_asset_inspect.json zone-artifacts/_v62/v60_source_materials.jpg
          git commit -m "V62 analyze actual V60 material images" || exit 0
          git push origin HEAD:vesuvius-v62-rim-texture-repair
