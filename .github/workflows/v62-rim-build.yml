name: V62 rebuild genuine stone rim (V60 preserved)
on:
  push:
    branches:
      - vesuvius-v62-rim-texture-repair
    paths:
      - .github/workflows/v62-rim-build.yml
      - tools/v62_build.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check numpy scipy pillow
      - name: Surgically replace only original V60 rim materials and repair GLB header
        run: python tools/v62_build.py
      - name: Quality gate on original top/bottom and animation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("zone-artifacts/_v62/v62_build_QA.json")
          d=json.loads(p.read_text())
          assert d["result"]=="PASS_RIM_ONLY_REAL_CHARCOAL_FROM_V60_TOP_BOTTOM"
          assert all(d[k] for k in ("top_material_unchanged","bottom_material_unchanged","original_animation_unchanged","original_mesh_uv_unchanged","original_rim_lava_unchanged","new_glb_header_valid"))
          assert d["base_header_error_bytes"]==8
          assert sum(x["size"] for x in d["parts"])==d["new_glb_bytes"]
          print("V62 QA",json.dumps(d,indent=2))
          PY
      - name: Commit evidence and then publish isolated chunks (20MB each)
        run: |
          git config user.name "GUSTAVA Artifact QA"
          git config user.email "actions@users.noreply.github.com"
          git add zone-artifacts/_v62/v62_build_QA.json zone-artifacts/_v62/v62_rim_before_after.jpg
          git commit -m "V62 QA for naturally textured rim" || true
          git -c http.version=HTTP/1.1 push origin HEAD:vesuvius-v62-rim-texture-repair
          for file in zone-artifacts/models/Vesuvius_V62_OriginalV60_NaturalStoneRim.part??.bin; do
            git add "$file"
            git commit -m "V62 rebuilt 3D GLB original V60 stone texture $(basename "$file")"
            git -c http.version=HTTP/1.1 -c http.postBuffer=134217728 push origin HEAD:vesuvius-v62-rim-texture-repair
          done
          echo "V62_COMPONENTS_PUBLISHED_TO_ISOLATED_BRANCH"
